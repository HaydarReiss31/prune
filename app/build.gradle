plugins {
    id('com.android.application')
}

android {
    namespace 'com.haydareiss.prune'

    defaultConfig {
        applicationId "com.haydareiss.prune"
        versionCode 2
        versionName "0.2.0"
    }

    buildFeatures {
        viewBinding true
    }

    // Release signing comes from environment variables (set by the GitHub workflow from repository
    // secrets). Without them the release APK is signed with the debug key so it still installs.
    signingConfigs {
        release {
            def keystore = System.getenv('KEYSTORE_FILE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 stays off for now: Shevery-API relies on Binder/AIDL classes that need keep rules first.
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':api')
    implementation project(':provider')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}
