name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prune
        uses: actions/checkout@v4

      # settings.gradle looks for the Shevery-API sources in the Shevery-API/ folder.
      # For reproducible builds, replace ref with a commit SHA.
      - name: Checkout Shevery-API
        uses: actions/checkout@v4
        with:
          repository: HmnDev-Tech/Shevery-API
          ref: main
          path: Shevery-API

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign the release APK with your own key (repository secrets, see README).
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prune.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/prune.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: the release APK will use the debug key."
          fi

      - name: Build debug and release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Prune-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Prune-debug
          path: app/build/outputs/apk/debug/*.apk
